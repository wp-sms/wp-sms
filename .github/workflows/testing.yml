name: Testing

on:
  pull_request:
    branches:
      - master
      - development
  # deploy.yml runs this same suite before anything reaches WordPress.org.
  workflow_call:

jobs:
  phpunit:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        php-version: ['8.4', '8.3', '8.2', '8.1', '8.0', '7.4']
    services:
      database:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wordpress_tests
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: phpunit-polyfills:1.1, wp-cli

      - name: Install required dependencies
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Setup tests
        run: bash bin/install-wp-tests.sh wordpress_tests root root 127.0.0.1 latest true

      - name: Run tests
        run: phpunit --testdox
